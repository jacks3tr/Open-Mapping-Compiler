name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.1"
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src tests
      - name: Test streamlined and server workflows
        run: >-
          uv run pytest
          tests/unit/model/test_bundles.py
          tests/unit/serialization/test_bundles.py
          tests/unit/test_compiler.py
          tests/unit/test_mapper.py
          tests/unit/providers/test_shorthand.py
          tests/integration/cli/test_build.py
          tests/integration/cli/test_apply.py
          tests/integration/cli/test_review_template.py
          tests/integration/server
          tests/integration/test_public_sdk.py
          tests/adversarial/test_bundle_tampering.py
          tests/adversarial/test_apply_streaming.py
          -q

  package-and-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.1"
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@8207627bc17876e239ecaac4eaa40c9d012d7140 # v7.0.0
        with:
          node-version: "24"
      - run: uv build
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:generated
