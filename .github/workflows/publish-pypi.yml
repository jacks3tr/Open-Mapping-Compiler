name: publish to pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.1"
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Require a versioned release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$REF_TYPE" = "tag"
          test "$RELEASE_TAG" = "v$VERSION"
      - run: uv build
      - name: Test the exact distribution before publication
        run: python tools/smoke_install.py dist/*.whl
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Install the published version from PyPI
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          python tools/smoke_install.py "open-mapping==$VERSION" --expected-version "$VERSION"

  container:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build, test, and publish the versioned sidecar
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/omc-docker
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$REF_TYPE" = "tag"
          test "$RELEASE_TAG" = "v$VERSION"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$GITHUB_SHA" .
          docker run --rm --network none --entrypoint open-mapping "$IMAGE:$VERSION" demo
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"
