[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-mapping"
version = "0.1.0"
description = "Portable, explainable, and deterministically verified schema mappings."
authors = [{ name = "Jacks3tr" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "PyYAML>=6.0",
    "rapidfuzz>=3.9",
    "typer>=0.12",
]

[project.optional-dependencies]
ai = ["httpx>=0.27"]

[project.scripts]
open-mapping = "open_mapping.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_mapping"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "open_mapping/schemas"
"examples" = "open_mapping/examples"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]
exclude = ["*.md", ".venv", "node_modules", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "B"]
ignore = ["ANN401", "E501", "UP040"]

[tool.ruff.lint.isort]
known-first-party = ["open_mapping"]

[tool.ruff.lint.per-file-ignores]
# Tagged Pydantic unions are dispatched at runtime; constant getattr keeps mypy sound.
"src/open_mapping/benchmark/runner.py" = ["B009"]
"src/open_mapping/evaluation/expressions.py" = ["B009"]
"src/open_mapping/evaluation/invariants.py" = ["B009"]
"src/open_mapping/matching/hints.py" = ["B009"]
"src/open_mapping/verification/static.py" = ["B009"]
"src/open_mapping/verification/type_inference.py" = ["B009"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Tests intentionally pass raw JSON-like fixtures through Pydantic validation boundaries.
init_typed = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: cross-module behavior",
    "golden: deterministic fixture comparison",
    "property: property-based tests",
    "adversarial: hostile input tests",
]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "hypothesis>=6.165.3",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260724",
]
